<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_mainpage.css') }}">

</head>
<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#news">News</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
      </div>
    <div class="homepage">
        <h1>Welcome to our Cinema App</h1>
        <div class="movie-thumbnails">
            {% for movie in movies %}
            <div class="movie">
                <a href="/movie/{{ movie.MovieID }}">
                    <img src="{{ movie.ThumbnailURL }}" alt="{{ movie.Title }}">
                    <div>{{ movie.Title }}</div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
